[project]
name = "laboratorio-drybean-ml"
version = "0.1.0"
description = "Laboratorio de clasificación multiclase — Dry Bean Dataset (UCI 602). CRISP-DM, TDSP y Scrum ML."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Jenifer Ramos" },
    { name = "Juan Velasquez" },
    { name = "Yan Cuaran" },
    { name = "Frank Daza" },
]
dependencies = [
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "ucimlrepo>=0.0.7",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: forescast
    environment: demo

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: forescast-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          component: forecast

  - job_name: forescast-streamlit
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8502"]
        labels:
          service: streamlit
          component: demo
